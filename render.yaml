# Render Blueprint for Training1
#
# In Render: New > Blueprint > pick this repo (carpe1al/Training1).
# It creates two things: a Postgres database and the API.
# The API code lives in its own repo (see `repo:` below).
#
# The website (carpe1al/Training1-Frontend) is hosted on Vercel, not here.
# In Vercel it needs one environment variable, NEXT_PUBLIC_API_BASE_URL, set to
# the API's address below. It is baked in at build time, so changing it needs a
# redeploy. training1.co is added on the Vercel project's Domains page, and the
# DNS records to create at the registrar are the ones Vercel shows there.
#
# The API is on the free plan: it goes to sleep after 15 minutes without
# traffic (the first request then takes ~1 minute) and can't send SMTP mail.
# The database is on the smallest paid plan, so it is kept (free databases are
# deleted 30 days after creation). Change `plan:` to upgrade either.
#
# The API's address is assumed to be https://training1-backend.onrender.com.
# If Render adds a suffix (e.g. training1-backend-x1y2.onrender.com), use that
# address for NEXT_PUBLIC_API_BASE_URL in Vercel and redeploy the website.

databases:
  - name: training1-db
    databaseName: training1
    user: training1
    # Smallest paid plan (256 MB RAM). Disk is billed per GB and can be raised
    # later (to 5 or a multiple of 5) but never lowered.
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: oregon

services:
  # API (Fastify + Prisma + Socket.IO)
  - type: web
    name: training1-backend
    runtime: node
    repo: https://github.com/carpe1al/Training1Backend
    branch: main
    plan: free
    region: oregon
    # --include=dev: TypeScript is a dev dependency and NODE_ENV=production would skip it.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Applies any new database migrations, then starts the server.
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: training1-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Every address the website can be opened from (comma-separated, exact match,
      # no trailing slash). To use the site at its vercel.app address too, add that here.
      - key: CORS_ORIGIN_FRONTEND
        value: https://training1.co,https://www.training1.co
      # The only emails that may be platform owners (comma-separated, e.g.
      # you@example.com,partner@example.com). Set by hand on the service's
      # Environment page. An owner account can only be created (at /owner-setup on
      # the website) for an email listed here, and it is re-checked on every
      # request, so removing an email shuts that owner out. Empty = no owners.
      - key: SUPER_ADMIN_EMAILS
        sync: false
      # A second secret asked for at /owner-setup, so knowing a listed email is not
      # enough to claim its account. Set by hand (a long random value) only while
      # you are adding an owner, then remove it. Unset = no new owners can be created.
      - key: OWNER_SETUP_CODE
        sync: false
      # Optional: the in-app assistant shows as "not set up" without it.
      - key: ANTHROPIC_API_KEY
        sync: false
