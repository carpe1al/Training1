# Render Blueprint for Training1
#
# In Render: New > Blueprint > pick this repo (carpe1al/Training1).
# It creates three things: a Postgres database, the API and the website.
# The API and website code live in their own repos (see `repo:` below).
#
# Everything is on the free plan to start. Free web services go to sleep after
# 15 minutes without traffic (first request then takes ~1 minute), and a free
# database is deleted after 30 days. Change `plan:` to upgrade.
#
# The two URLs below assume Render gives the services their plain names.
# If Render adds a suffix (e.g. training1-backend-x1y2.onrender.com), update
# CORS_ORIGIN_FRONTEND and NEXT_PUBLIC_API_BASE_URL to match and redeploy.

databases:
  - name: training1-db
    databaseName: training1
    user: training1
    plan: free
    region: oregon

services:
  # API (Fastify + Prisma + Socket.IO)
  - type: web
    name: training1-backend
    runtime: node
    repo: https://github.com/carpe1al/Training1Backend
    branch: main
    plan: free
    region: oregon
    # --include=dev: TypeScript is a dev dependency and NODE_ENV=production would skip it.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Applies any new database migrations, then starts the server.
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: training1-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN_FRONTEND
        value: https://training1-frontend.onrender.com
      # Optional: the in-app assistant shows as "not set up" without it.
      - key: ANTHROPIC_API_KEY
        sync: false

  # Website (Next.js)
  - type: web
    name: training1-frontend
    runtime: node
    repo: https://github.com/carpe1al/Training1-Frontend
    branch: main
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: NODE_ENV
        value: production
      # Baked in at build time: changing it needs a redeploy, not just a restart.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://training1-backend.onrender.com
